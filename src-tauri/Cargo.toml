[package]
name = "sistecpos-core"
version = "0.1.0"
description = "SistecPOS Core — runtime de escritorio multi-tenant"
authors = ["SistecPOS"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Evita abrir consola en Windows en builds de release.
default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
